[package]
name = "echocast"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echocast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 是用户导入形象包的前提：用户包的图片在 $APPDATA 里，
# 只能通过 asset 协议交给 WebView 加载。这个 feature 必须和
# tauri.conf.json 的 app.security.assetProtocol 同时开，少一边就会在
# build script 阶段直接失败。
# tray-icon 是系统托盘（状态栏）的前提：设置、静音、退出都挂在托盘菜单上。
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macros 是 tokio::select! 的前提；net 是本地演示服务端监听端口的前提；
# rt 由 tauri 自带的多线程运行时提供。
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "net"] }
# native-tls 走 Windows SChannel，不引入 OpenSSL —— 加它是为了 wss:// 能用。
# handshake 是本地演示服务端做 WS 服务端握手的前提；只要 ws:// 的话
# 去掉 native-tls 这个 feature 就行，编译能快一分钟。
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "native-tls"] }
futures-util = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
# 媒体附件下载用 ureq 而不是 reqwest：阻塞式、依赖树小一个量级，
# 在 async 命令里 spawn_blocking 包住即可。native-tls 与 WS 同走 SChannel。
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
