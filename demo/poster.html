<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:1280px; overflow:hidden; }

  :root{
    --bg:#070d18;
    --ink:#e8eef8;
    --accent:#4fd6c3;        /* EchoCast 青绿 */
    --accent2:#f0b45b;       /* 上行暖黄 */
    --glass:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.12);
  }

  body{
    position:relative;
    font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;
    color:var(--ink);
    background:
      radial-gradient(900px 700px at 78% 30%, rgba(79,214,195,.13), transparent 62%),
      radial-gradient(700px 560px at 12% 88%, rgba(240,180,91,.09), transparent 60%),
      radial-gradient(1200px 900px at 50% 118%, rgba(38,84,140,.35), transparent 70%),
      var(--bg);
  }

  /* 装饰轨道：呼应 demo 拓扑区的双圈轨道 */
  .orbit{ position:absolute; border-radius:50%; border:1px dashed rgba(255,255,255,.10); }
  .orbit.o1{ width:1040px; height:1040px; top:60px; right:-300px; animation:spin 90s linear infinite; }
  .orbit.o2{ width:1320px; height:1320px; top:-80px; right:-440px; border-style:dotted; animation:spin 140s linear infinite reverse; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .orbit i{ position:absolute; width:10px; height:10px; border-radius:50%; }
  .orbit.o1 i{ top:-5px; left:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); }
  .orbit.o2 i{ bottom:120px; left:-5px; background:var(--accent2); box-shadow:0 0 14px var(--accent2); }

  /* 顶部品牌行 */
  .brand{
    position:absolute; top:64px; left:80px;
    display:flex; align-items:center; gap:16px;
    font-family:"Inter","Segoe UI",sans-serif;
  }
  .brand .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 5px rgba(79,214,195,.18), 0 0 22px var(--accent);
  }
  .brand b{ font-size:26px; letter-spacing:.22em; font-weight:700; color:#cfe0ea; }
  .brand span{ font-size:15px; letter-spacing:.14em; color:rgba(232,238,248,.45); margin-left:6px; }

  /* 主标题区 */
  .hero{ position:absolute; left:80px; top:210px; width:760px; }
  .hero .kicker{
    display:inline-flex; align-items:center; gap:10px;
    font-family:"Inter","Segoe UI",sans-serif;
    font-size:19px; letter-spacing:.30em; color:var(--accent);
    border:1px solid rgba(79,214,195,.35); border-radius:999px;
    padding:9px 22px; background:rgba(79,214,195,.07);
  }
  .hero h1{
    margin-top:38px;
    font-size:100px; line-height:1.14; font-weight:900; letter-spacing:.02em;
    text-shadow:0 8px 40px rgba(0,0,0,.45);
  }
  .hero h1 em{ font-style:normal; color:var(--accent); }
  .hero .sub{
    margin-top:34px;
    font-size:34px; line-height:1.6; font-weight:400;
    color:rgba(232,238,248,.72); letter-spacing:.06em;
  }
  .hero .sub b{ color:var(--ink); font-weight:700; }

  /* 气泡 mockup：真实客户端气质的玻璃卡 */
  .bubble{
    position:absolute; right:96px; top:300px; width:560px;
    background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    border:1px solid var(--line);
    border-radius:26px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.14);
    padding:26px 30px;
    backdrop-filter:blur(6px);
    transform:rotate(-1.6deg);
    z-index:3;
  }
  .bubble .row{ display:flex; align-items:center; gap:18px; }
  .bubble .buddy{
    width:96px; height:96px; border-radius:22px; flex:none;
    background:radial-gradient(circle at 50% 38%, rgba(79,214,195,.16), rgba(8,14,26,.4));
    border:1px solid rgba(79,214,195,.28);
    display:flex; align-items:center; justify-content:center;
  }
  .bubble .buddy img{ width:78px; height:78px; image-rendering:auto; }
  .bubble .tt{ font-size:25px; font-weight:700; letter-spacing:.03em; }
  .bubble .st{ margin-top:8px; font-size:19px; color:var(--accent); letter-spacing:.04em;
    font-family:"Inter","Segoe UI",sans-serif; }
  .bubble .prog{
    margin-top:20px; height:9px; border-radius:99px; overflow:hidden;
    background:rgba(255,255,255,.08);
  }
  .bubble .prog i{
    display:block; height:100%; width:85%; border-radius:99px;
    background:linear-gradient(90deg, #2fa89a, var(--accent));
    box-shadow:0 0 16px rgba(79,214,195,.55);
  }
  .bubble .meta{
    margin-top:14px; font-size:15.5px; color:rgba(232,238,248,.42);
    font-family:"Inter","Segoe UI",sans-serif; letter-spacing:.08em;
  }

  /* 第二个失败气泡，压角错落 */
  .bubble.fail{
    right:410px; top:520px; width:430px; padding:20px 26px;
    transform:rotate(1.8deg); border-color:rgba(240,110,110,.30);
    box-shadow:0 34px 80px -30px rgba(0,0,0,.8), 0 0 40px -18px rgba(240,110,110,.45);
  }
  .bubble.fail .row{ gap:14px; }
  .bubble.fail .buddy{ width:64px; height:64px; border-radius:16px;
    border-color:rgba(240,110,110,.35);
    background:radial-gradient(circle at 50% 38%, rgba(240,110,110,.14), rgba(8,14,26,.4)); }
  .bubble.fail .buddy img{ width:50px; height:50px; }
  .bubble.fail .tt{ font-size:20px; }
  .bubble.fail .st{ color:#ef8181; }

  /* 主机器人：大图 */
  .robot{
    position:absolute; right:110px; bottom:120px; width:640px; height:640px;
    filter:drop-shadow(0 34px 60px rgba(0,0,0,.6));
  }
  .robot img{ width:100%; height:100%; object-fit:contain; }
  .robot .halo{
    position:absolute; inset:-40px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(79,214,195,.16), transparent 64%);
  }

  /* 底部信息条 */
  .foot{
    position:absolute; left:80px; bottom:72px;
    display:flex; align-items:center; gap:26px;
    font-family:"Inter","Segoe UI",sans-serif;
    font-size:21px; color:rgba(232,238,248,.55); letter-spacing:.06em;
  }
  .foot .tag{
    padding:10px 22px; border-radius:999px;
    border:1px solid var(--line); background:var(--glass);
    color:rgba(232,238,248,.78); font-size:19px;
  }
  .foot .tag.hi{
    border-color:rgba(240,180,91,.4); background:rgba(240,180,91,.09); color:#f3c98a;
  }
</style>
</head>
